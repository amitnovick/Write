  #     working-directory: syncscribble

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout SDL write-android branch
      run: |
        cd SDL
        git checkout -b write-android origin/write-android

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"

    - name: Setup Gradle wrapper
      run: |
        cd syncscribble/android
        gradle wrapper --gradle-version 8.6

    - name: Build Android Debug APK
      run: |
        cd syncscribble/android
        export ANDROID_HOME=$ANDROID_HOME
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: write-android-debug
        path: syncscribble/android/app/build/outputs/apk/debug/app-debug.apk
